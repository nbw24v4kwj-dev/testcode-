<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人中心 - DocCode 官方商城</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <div class="logo">DocCode</div>
      <nav>
        <a href="index.html">首页</a>
        <a href="purchase.html">购买套餐</a>
        <a href="profile.html" class="active">个人中心</a>
      </nav>
      <button class="ghost-btn">退出登录</button>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container profile-hero">
        <div>
          <p class="badge">企业账号</p>
          <h1>你好，晨曦科技团队</h1>
          <p>已订阅：增长版套餐 · 到期时间 2025-12-31</p>
        </div>
        <button class="primary-btn">续费套餐</button>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="profile-grid">
          <aside class="profile-menu">
            <button class="menu-item active">账户概览</button>
            <button class="menu-item">模板下载</button>
            <button class="menu-item">订单记录</button>
            <button class="menu-item">团队成员</button>
            <button class="menu-item">通知中心</button>
          </aside>
          <div class="profile-content">
            <div class="panel">
              <h3>使用概览</h3>
              <div class="metrics">
                <div>
                  <strong>186</strong>
                  <span>已下载模板</span>
                </div>
                <div>
                  <strong>12</strong>
                  <span>活跃成员</span>
                </div>
                <div>
                  <strong>4</strong>
                  <span>待处理审批</span>
                </div>
              </div>
            </div>
            <div class="panel">
              <h3>最近下载</h3>
              <div class="download-list">
                <div class="download-item">
                  <div>
                    <h4>需求评审清单</h4>
                    <p>2024-11-12 · PRD 模板</p>
                  </div>
                  <button class="ghost-btn">再次下载</button>
                </div>
                <div class="download-item">
                  <div>
                    <h4>支付系统 API 文档</h4>
                    <p>2024-11-09 · 接口文档</p>
                  </div>
                  <button class="ghost-btn">再次下载</button>
                </div>
                <div class="download-item">
                  <div>
                    <h4>测试用例管理表</h4>
                    <p>2024-11-02 · 测试模板</p>
                  </div>
                  <button class="ghost-btn">再次下载</button>
                </div>
              </div>
            </div>
            <div class="panel">
              <h3>团队管理</h3>
              <div class="team-grid">
                <div class="team-card">
                  <h4>剩余席位</h4>
                  <p>3 个</p>
                  <button class="primary-btn">邀请成员</button>
                </div>
                <div class="team-card">
                  <h4>权限方案</h4>
                  <p>可设置编辑与下载权限</p>
                  <button class="ghost-btn">设置权限</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <h3>DocCode</h3>
        <p>企业文档与代码资产管理中心。</p>
      </div>
      <div>
        <h4>账户</h4>
        <a href="#">安全设置</a>
        <a href="#">发票管理</a>
      </div>
      <div>
        <h4>服务</h4>
        <a href="#">专属客服</a>
        <a href="#">工单系统</a>
      </div>
    </div>
  </footer>
</body>
</html>
